<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NB Data Explorer — Aperçu</title>
<style>
:root{--navy:#173f5f;--blue:#2878a8;--bg:#f4f7fb;--ink:#203040;--muted:#64748b;--border:#dce3ea;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:var(--navy);color:white;padding:18px 28px 0}
header h1{margin:0;font-size:23px}header p{margin:4px 0 0;color:#dceaf4;font-size:13px}
nav.menu{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
nav.menu button{border:none;background:transparent;color:#cfe2f0;padding:10px 16px;border-radius:9px 9px 0 0;font:inherit;font-weight:600;cursor:pointer}
nav.menu button:hover{background:#1e4d73;color:white}
nav.menu button.active{background:var(--bg);color:var(--navy)}
main{max-width:1200px;margin:20px auto;padding:0 20px}
section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #14283c08}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
.new{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;vertical-align:middle;margin-left:8px}
.status{padding:10px 12px;border-radius:8px;background:#eef4f8;color:#27465d;margin:12px 0;font-size:13px}
.table-wrap{overflow:auto;max-width:100%;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid #e7edf2;text-align:left}
th{background:#f1f5f9}
.chart{width:100%}
.chart svg{width:100%;height:auto;display:block;max-height:340px}
footer{text-align:center;color:var(--muted);padding:12px 20px 28px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>NB Data Explorer</h1>
  <p>Aperçu — données de démonstration intégrées</p>
  <nav class="menu" id="topMenu">
    <button type="button" data-page="summary" class="active">Résumé séance</button>
    <button type="button" data-page="player">Statistiques par joueur</button>
    <button type="button" data-page="group">Groupes personnalisés</button>
    <button type="button" data-page="diag">Diagnostic zones FC</button>
  </nav>
</header>
<main><div id="page"></div></main>
<footer>Aperçu des modifications : graphique « groupes de postes » en premier sur l'accueil · diagnostic FC masqué, visible uniquement dans son onglet.</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const zoneColors=["#3b82f6","#14b8a6","#f59e0b","#ef4444"];
const zones=["Récupération","Moyenne intensité","Haute intensité","Très haute intensité"];
const players=["Joueur A","Joueur B","Joueur C","Joueur D"];
// Données démo : durée moyenne par zone (min) par joueur
const demoZones=players.map(()=>[28,14,9,4].map(v=>v*(0.8+Math.random()*0.4)));
const groups=["Big Five","3e Ligne","Trois quarts"];
const demoGroups=groups.map(()=>[30,15,10,4].map(v=>v*(0.7+Math.random()*0.6)));

function svgEl(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function fmt(v){return Number(v).toLocaleString("fr-FR",{maximumFractionDigits:1});}

function barChart(series,labels,colors,opts){
  opts=opts||{};
  const W=900,H=300,m={t:22,r:14,b:44,l:56};
  const maxV=Math.max(...series.flat())*1.1||1;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  for(let i=0;i<=4;i++){
    const y=m.t+ih-ih*i/4;
    svg.appendChild(svgEl("line",{x1:m.l,y1:y,x2:W-m.r,y2:y,stroke:"#e2e8f0"}));
    const t=svgEl("text",{x:m.l-8,y:y+4,"text-anchor":"end","font-size":11,fill:"#64748b"});
    t.textContent=fmt(maxV*i/4);svg.appendChild(t);
  }
  const gW=iw/labels.length,barW=Math.max(4,(gW-10)/series.length);
  labels.forEach((lab,li)=>{
    const gx=m.l+gW*li;
    series.forEach((s,si)=>{
      const v=s[li],h=ih*(v/maxV);
      const wBar=barW-3,x=gx+5+si*barW;
      const rect=svgEl("rect",{x,y:m.t+ih-h,width:wBar,height:h,fill:colors[si],rx:3});
      const rg=opts.range?opts.range(li,si):null;
      const ti=svgEl("title");
      ti.textContent=`${lab} — ${zones[si]} : ${fmt(v)} min`+(rg?` · min ${fmt(rg.min)} · max ${fmt(rg.max)}`:"");
      rect.appendChild(ti);
      svg.appendChild(rect);
      if(rg&&rg.min!==null&&rg.max!==null&&rg.min<=rg.max){
        const cx=x+wBar/2;
        const y1=m.t+ih-ih*(rg.max/maxV),y2=m.t+ih-ih*(rg.min/maxV);
        svg.appendChild(svgEl("line",{x1:cx,y1,x2:cx,y2,stroke:"#334155","stroke-width":1.5}));
        [y1,y2].forEach(yy=>svg.appendChild(svgEl("line",{x1:cx-4,y1:yy,x2:cx+4,y2:yy,stroke:"#334155","stroke-width":1.5})));
      }
      const lab2=opts.valueLabel?opts.valueLabel(v,li,si):null;
      if(lab2){
        const t2=svgEl("text",{x:x+wBar/2,y:m.t+ih-h-5,"text-anchor":"middle","font-size":9,"font-weight":600,fill:"#203040"});
        t2.textContent=lab2;svg.appendChild(t2);
      }
    });
    const t=svgEl("text",{x:gx+gW/2,y:H-m.b+18,"text-anchor":"middle","font-size":11});
    t.textContent=lab;svg.appendChild(t);
  });
  series.forEach((s,si)=>{
    const lx=m.l+si*160,ly=H-12;
    svg.appendChild(svgEl("rect",{x:lx,y:ly-10,width:12,height:12,fill:colors[si],rx:2}));
    const t=svgEl("text",{x:lx+18,y:ly,"font-size":12});t.textContent=s._name;svg.appendChild(t);
  });
  return svg;
}

function h3(text,badge){
  const h=document.createElement("h3");h.textContent=text;
  if(badge){const b=document.createElement("span");b.className="new";b.textContent=badge;h.appendChild(b);}
  return h;
}

function renderSummary(page){
  const sec=document.createElement("section");
  sec.appendChild(h2("Résumé séance"));
  const st=document.createElement("div");st.className="status";
  st.textContent="Séance du 22/10/2026 (dernière date disponible) · 4 joueur(s) · 24 ligne(s) · comparaison avec le 19/10/2026.";
  sec.appendChild(st);
  // 1er graphique : par groupe de postes (nouvel ordre)
  sec.appendChild(h3("Zones FC par groupe de postes — moyenne (barre) et min–max (trait vertical)","DÉPLACÉ EN 1er"));
  const c1=document.createElement("div");c1.className="chart";
  const gs=demoGroups.map((means,i)=>{const s=means.slice();s._name=zones[i];return s;});
  const gTotals=groups.map((g,li)=>gs.reduce((acc,s)=>acc+(s[li]||0),0));
  const gRanges=zones.map((z,si)=>groups.map((g,li)=>({
    min:Math.max(0,demoGroups[li][si]*0.6),
    max:demoGroups[li][si]*1.4
  })));
  c1.appendChild(barChart(gs,groups,zoneColors,{
    range:(li,si)=>gRanges[si][li],
    valueLabel:(v,li,si)=>v!==null&&gTotals[li]>0?`${fmt(v,1)} · ${fmt(v/gTotals[li]*100,0)}%`:null
  }));sec.appendChild(c1);
  // 2e graphique : par joueur
  sec.appendChild(h3("Zones de fréquence cardiaque par joueur (durée par séance)"));
  const c2=document.createElement("div");c2.className="chart";
  const ps=demoZones.map((means,i)=>{const s=means.slice();s._name=zones[i];return s;});
  c2.appendChild(barChart(ps,players,zoneColors));sec.appendChild(c2);
  page.appendChild(sec);
}

function renderPlaceholder(page,msg){
  const sec=document.createElement("section");
  sec.appendChild(h2(msg.title));
  const p=document.createElement("p");p.className="muted";p.textContent=msg.text;
  sec.appendChild(p);page.appendChild(sec);
}

function renderDiag(page){
  const sec=document.createElement("section");
  sec.appendChild(h2("Diagnostic des zones FC"));
  const p=document.createElement("p");p.className="muted";
  p.textContent="Colonnes détectées dans tes fichiers. Une zone reste vide si une de ses colonnes sources est absente ou ne contient aucune valeur exploitable.";
  sec.appendChild(p);
  const wrap=document.createElement("div");wrap.className="table-wrap";
  const t=document.createElement("table");
  t.innerHTML="<thead><tr><th>Zone FC</th><th>Colonnes sources attendues</th><th>Colonnes détectées</th><th>Lignes avec zone calculée</th></tr></thead>";
  const tb=document.createElement("tbody");
  const rows=[
    ["Récupération","Duration <50% FCmax · Duration 50-60% FCmax · Duration 60-70%FCmax","✓ · ✓ · ✓","326 / 326"],
    ["Moyenne intensité","Duration 70-80%FCmax · Duration 80-85% FC max","✓ · ✓","326 / 326"],
    ["Haute intensité","Duration 85-90% FC max · Duration 90-95% FC max","✓ · ✓","326 / 326"],
    ["Très haute intensité","Duration 95-100% FC max","« Duration 95-100% FC max » introuvable","0 / 326"],
  ];
  rows.forEach(r=>{const tr=document.createElement("tr");r.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});tb.appendChild(tr);});
  t.appendChild(tb);wrap.appendChild(t);sec.appendChild(wrap);
  page.appendChild(sec);
}

function h2(text){const h=document.createElement("h2");h.textContent=text;return h;}

function renderPage(){
  const page=$("page");page.replaceChildren();
  if(currentPage==="summary")renderSummary(page);
  else if(currentPage==="diag")renderDiag(page);
  else renderPlaceholder(page,{title:currentPage==="player"?"Statistiques par joueur":"Groupes personnalisés",
    text:"Page inchangée dans cet aperçu — seules les modifications demandées sont montrées ici."});
}
let currentPage="summary";
document.querySelectorAll("#topMenu button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentPage=btn.dataset.page;
    document.querySelectorAll("#topMenu button").forEach(b=>b.classList.toggle("active",b===btn));
    renderPage();
  });
});
renderPage();
</script>
</body>
</html>
